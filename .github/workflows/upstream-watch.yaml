# SPDX-License-Identifier: Apache-2.0
name: Upstream Watch

on:
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-strapi:
    name: Check Strapi upstream release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Open issue when upstream has a newer release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_REPO: strapi/strapi
          STRAPI_PACKAGE: "@strapi/strapi"
          UPGRADE_DOCS_URL: https://docs.strapi.io/cms/upgrade-tool
          MIGRATION_DOCS_URL: https://docs.strapi.io/cms/migration/v4-to-v5/introduction-and-faq
          RELEASES_URL: https://github.com/strapi/strapi/releases
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(jq -r '.dependencies["@strapi/strapi"]' package.json)"
          CURRENT_VERSION="${CURRENT_VERSION#^}"
          if [[ -z "$CURRENT_VERSION" || "$CURRENT_VERSION" == "null" ]]; then
            echo "Could not find @strapi/strapi in package.json" >&2
            exit 1
          fi

          LATEST_VERSION="$(npm view "$STRAPI_PACKAGE" version)"
          if [[ -z "$LATEST_VERSION" ]]; then
            echo "Could not resolve latest Strapi version from npm" >&2
            exit 1
          fi

          echo "Current Strapi version: ${CURRENT_VERSION}"
          echo "Latest Strapi version: ${LATEST_VERSION}"

          if [[ "$CURRENT_VERSION" == "$LATEST_VERSION" ]]; then
            echo "Strapi is already up to date."
            exit 0
          fi

          if release_json="$(gh api "repos/${UPSTREAM_REPO}/releases/tags/v${LATEST_VERSION}" 2>/dev/null)"; then
            RELEASE_URL="$(jq -r '.html_url' <<< "$release_json")"
            PUBLISHED_AT="$(jq -r '.published_at' <<< "$release_json")"
            RELEASE_NAME="$(jq -r '.name // .tag_name' <<< "$release_json")"
            RELEASE_NOTES="$(jq -r '.body // "No release notes provided."' <<< "$release_json" | head -c 12000)"
          else
            RELEASE_URL="${RELEASES_URL}"
            PUBLISHED_AT="unknown"
            RELEASE_NAME="v${LATEST_VERSION}"
            RELEASE_NOTES="No GitHub release object was found for v${LATEST_VERSION}. Review the releases page and npm package metadata manually."
          fi

          STRAPI_DEPENDENCIES="$(jq -r '.dependencies | to_entries[] | select(.key | startswith("@strapi/")) | "- `" + .key + "`: `" + .value + "`"' package.json)"

          gh label create upstream-update --color 0E8A16 --description "Official upstream update available" || true
          gh label create strapi --color 5319E7 --description "Strapi base image maintenance" || true

          title="Update Strapi from ${CURRENT_VERSION} to ${LATEST_VERSION}"
          existing_issue="$(gh issue list \
            --state open \
            --search "repo:${GH_REPO} is:issue is:open in:title \"${title}\"" \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$existing_issue" ]]; then
            echo "Issue #${existing_issue} already tracks ${LATEST_VERSION}."
            exit 0
          fi

          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          An official Strapi release newer than the packaged HelmForge base image was found.

          ## Version

          - Current packaged version: \`${CURRENT_VERSION}\`
          - Latest upstream version: \`${LATEST_VERSION}\`
          - Release name: ${RELEASE_NAME}
          - Published at: ${PUBLISHED_AT}
          - npm package: https://www.npmjs.com/package/@strapi/strapi/v/${LATEST_VERSION}

          ## Current Strapi Dependencies

          ${STRAPI_DEPENDENCIES}

          ## Official Sources

          - Upstream repository: https://github.com/${UPSTREAM_REPO}
          - Releases: ${RELEASES_URL}
          - Release notes: ${RELEASE_URL}
          - Upgrade tool docs: ${UPGRADE_DOCS_URL}
          - Migration docs: ${MIGRATION_DOCS_URL}

          ## Update Instructions

          1. Update all Strapi packages in \`package.json\` to \`${LATEST_VERSION}\`:

             \`\`\`bash
             npm install @strapi/strapi@${LATEST_VERSION} \\
               @strapi/plugin-cloud@${LATEST_VERSION} \\
               @strapi/plugin-users-permissions@${LATEST_VERSION}
             \`\`\`

          2. Refresh \`package-lock.json\` with \`npm install\`.
          3. Run Strapi's dry-run upgrade helper:

             \`\`\`bash
             npm run upgrade:dry
             \`\`\`

          4. Build and smoke test the production image:

             \`\`\`bash
             docker build -f Dockerfile.prod -t helmforge/strapi-base:${LATEST_VERSION} .
             docker run --rm -p 1337:1337 \\
               -e APP_KEYS="key1,key2,key3,key4" \\
               -e API_TOKEN_SALT="token-salt" \\
               -e ADMIN_JWT_SECRET="admin-secret" \\
               -e JWT_SECRET="jwt-secret" \\
               -e TRANSFER_TOKEN_SALT="transfer-salt" \\
               helmforge/strapi-base:${LATEST_VERSION}
             \`\`\`

          5. Validate \`/_health\`, admin startup, database compatibility, and logs.
          6. Update README version references and release workflow text.
          7. Open a PR with the version bump, validation evidence, and any chart/site follow-up required by HelmForge.

          ## Release Notes

          ${RELEASE_NOTES}

          EOF

          gh issue create \
            --title "$title" \
            --label upstream-update \
            --label strapi \
            --body-file "$body_file"
